<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="icon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>B-Least JS</title>
        <script type="module" src="main.js"></script>
    </head>
    <body>
        <div class="data">
            <form id="controls">
                <select id="examples">
                    <option value="0">ISO 10723:2012, Nitrogen</option>
                    <option value="1">ISO 10723:2012, Carbon Dioxide</option>
                    <option value="2">ISO 10723:2012, Methane</option>
                    <option value="3">ISO 10723:2012, Ethane</option>
                </select>
                <div>
                    <label>
                        <input type="radio" name="type" value="analysis" checked />
                        Analysis function
                    </label>
                    <label>
                        <input type="radio" name="type" value="calibration" />
                        Calibration function
                    </label>
                </div>
            </form>

            <div class="input-container">
                <h3>Input data</h3>
                <table class="input-table">
                    <tbody id="input-tbody"></tbody>
                </table>
            </div>

            <table class="results-table">
                <caption></caption>
                <tbody id="results-tbody"></tbody>
            </table>

            <div class="add-chart">
                <canvas id="chart-2"></canvas>
            </div>
        </div>

        <div class="main-chart">
            <form id="legend">
                <!-- prettier-ignore -->
                <label class="i">
                    <input type="checkbox" name="f1" checked />
                    f<sup>1</sup> <span>—</span>
                </label>
                <!-- prettier-ignore -->
                <label class="i">
                    <input type="checkbox" name="f2" checked />
                    f<sup>2</sup> <span>—</span>
                </label>
                <!-- prettier-ignore -->
                <label class="i">
                    <input type="checkbox" name="f3" checked />
                    f<sup>3</sup> <span>—</span>
                </label>
            </form>
            <div class="main-chart-cont">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </body>
</html>
